name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: python -m unittest -v tests.test_auth_flow

  build-and-verify-artifacts:
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify runtime-only package contents
        run: |
          python - <<'PY'
          import glob
          import os
          import tarfile
          import zipfile

          blocked_prefixes = (
              "tests/",
              ".github/",
              "README_DEVELOPMENT.md",
              "script_example.py",
          )

          sdists = glob.glob("dist/*.tar.gz")
          wheels = glob.glob("dist/*.whl")

          if not sdists or not wheels:
              raise SystemExit("Expected both sdist and wheel artifacts.")

          def ensure_allowed(paths, artifact):
              for path in paths:
                  normalized = path.replace('\\\\', '/')
                  if any(
                      normalized == prefix or normalized.startswith(prefix)
                      for prefix in blocked_prefixes
                  ):
                      raise SystemExit(f"Blocked path '{normalized}' found in {artifact}")

          for sdist in sdists:
              with tarfile.open(sdist, "r:gz") as tar:
                  members = [member.name for member in tar.getmembers()]
                  trimmed = [name.split('/', 1)[1] if '/' in name else name for name in members]
                  ensure_allowed(trimmed, os.path.basename(sdist))

          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  ensure_allowed(zf.namelist(), os.path.basename(wheel))

          print("Artifact content checks passed.")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
